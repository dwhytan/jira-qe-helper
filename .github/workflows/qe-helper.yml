# Formulario: Actions → "QE Helper" → Run workflow
name: QE Helper

run-name: "Subtareas QE · ${{ inputs.issue_key }} · @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Historia de usuario (ej. QA-100)"
        type: string
        required: true
      # Fases a crear (4 subtareas c/u, detalle en el README). Todas, algunas o ninguna.
      fase_planificacion:
        description: "Planificación (4 subtareas)"
        type: boolean
        default: true
      fase_diseno:
        description: "Diseño (4 subtareas)"
        type: boolean
        default: true
      fase_preparacion:
        description: "Preparación (4 subtareas)"
        type: boolean
        default: true
      fase_ejecucion:
        description: "Ejecución (4 subtareas)"
        type: boolean
        default: true
      fase_cierre:
        description: "Cierre (4 subtareas)"
        type: boolean
        default: true

concurrency:
  group: qe-helper-${{ inputs.issue_key }}

permissions:
  contents: read

jobs:
  subtasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Destino fijado por el admin en la variable de repositorio QE_TARGET (mock por defecto):
    # el usuario no lo elige. Cada Environment tiene sus propios secrets.
    environment: ${{ vars.QE_TARGET || 'mock' }}
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      QE_ISSUE_KEY: ${{ inputs.issue_key }}   # vía env, nunca interpolado en el script
      QE_FASE_1: ${{ inputs.fase_planificacion }}
      QE_FASE_2: ${{ inputs.fase_diseno }}
      QE_FASE_3: ${{ inputs.fase_preparacion }}
      QE_FASE_4: ${{ inputs.fase_ejecucion }}
      QE_FASE_5: ${{ inputs.fase_cierre }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qe-subtareas
        with:
          target: ${{ vars.QE_TARGET || 'mock' }}
