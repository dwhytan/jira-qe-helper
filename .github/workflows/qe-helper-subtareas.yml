# Opción A: una casilla por subtarea (comparar con qe-helper.yml, una por fase).
# Formulario: Actions → "QE Helper · subtareas" → Run workflow
name: QE Helper · subtareas

run-name: "Subtareas QE · ${{ inputs.issue_key }} · ${{ inputs.target }} · @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Historia de usuario (ej. QA-100)"
        type: string
        required: true
      target:
        description: "mock = simulación en el runner · jira-cloud = instancia real"
        type: choice
        options: [mock, jira-cloud]
        default: mock
      # Una casilla por subtarea (texto completo en App.PHASES). Máximo de GitHub: 25 inputs.
      st_01:
        description: "Plan · Criterios de aceptación"
        type: boolean
        default: true
      st_02:
        description: "Plan · Plan de pruebas"
        type: boolean
        default: true
      st_03:
        description: "Plan · Estimación de esfuerzo"
        type: boolean
        default: true
      st_04:
        description: "Plan · Riesgos de calidad"
        type: boolean
        default: true
      st_05:
        description: "Diseño · Casos funcionales"
        type: boolean
        default: true
      st_06:
        description: "Diseño · Pruebas performance"
        type: boolean
        default: true
      st_07:
        description: "Diseño · Pruebas seguridad"
        type: boolean
        default: true
      st_08:
        description: "Diseño · Revisión de casos"
        type: boolean
        default: true
      st_09:
        description: "Prep · Datos de prueba"
        type: boolean
        default: true
      st_10:
        description: "Prep · Ambiente de pruebas"
        type: boolean
        default: true
      st_11:
        description: "Prep · Automatización"
        type: boolean
        default: true
      st_12:
        description: "Prep · Smoke test en QA"
        type: boolean
        default: true
      st_13:
        description: "Ejec · Funcionales"
        type: boolean
        default: true
      st_14:
        description: "Ejec · Regresión"
        type: boolean
        default: true
      st_15:
        description: "Ejec · Performance"
        type: boolean
        default: true
      st_16:
        description: "Ejec · Seguridad"
        type: boolean
        default: true
      st_17:
        description: "Cierre · Defectos"
        type: boolean
        default: true
      st_18:
        description: "Cierre · Evidencias"
        type: boolean
        default: true
      st_19:
        description: "Cierre · Pruebas en producción"
        type: boolean
        default: true
      st_20:
        description: "Cierre · Informe de cierre"
        type: boolean
        default: true

concurrency:
  group: qe-helper-${{ inputs.issue_key }}

permissions:
  contents: read

jobs:
  subtasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}   # cada destino tiene sus propios secrets
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -ntp -q package

      - name: Levantar mock de Jira
        if: inputs.target == 'mock'
        run: |
          MOCK_JIRA_EMAIL="$JIRA_EMAIL" MOCK_JIRA_TOKEN="$JIRA_API_TOKEN" \
            nohup python3 mock/jira_mock.py > mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8089/health && exit 0; sleep 0.5; done
          cat mock.log; exit 1

      - name: Crear subtareas QE
        env:
          JIRA_BASE_URL: ${{ inputs.target == 'mock' && 'http://127.0.0.1:8089' || vars.JIRA_BASE_URL }}
          QE_ISSUE_KEY: ${{ inputs.issue_key }}   # vía env, nunca interpolado en el script
          QE_SUBTASK_1: ${{ inputs.st_01 }}
          QE_SUBTASK_2: ${{ inputs.st_02 }}
          QE_SUBTASK_3: ${{ inputs.st_03 }}
          QE_SUBTASK_4: ${{ inputs.st_04 }}
          QE_SUBTASK_5: ${{ inputs.st_05 }}
          QE_SUBTASK_6: ${{ inputs.st_06 }}
          QE_SUBTASK_7: ${{ inputs.st_07 }}
          QE_SUBTASK_8: ${{ inputs.st_08 }}
          QE_SUBTASK_9: ${{ inputs.st_09 }}
          QE_SUBTASK_10: ${{ inputs.st_10 }}
          QE_SUBTASK_11: ${{ inputs.st_11 }}
          QE_SUBTASK_12: ${{ inputs.st_12 }}
          QE_SUBTASK_13: ${{ inputs.st_13 }}
          QE_SUBTASK_14: ${{ inputs.st_14 }}
          QE_SUBTASK_15: ${{ inputs.st_15 }}
          QE_SUBTASK_16: ${{ inputs.st_16 }}
          QE_SUBTASK_17: ${{ inputs.st_17 }}
          QE_SUBTASK_18: ${{ inputs.st_18 }}
          QE_SUBTASK_19: ${{ inputs.st_19 }}
          QE_SUBTASK_20: ${{ inputs.st_20 }}
        run: java -jar target/qe-helper.jar
