# Build + tests unitarios + e2e contra el mock (credenciales ficticias, no requiere secrets).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + unit tests
        run: mvn -B -ntp verify
      - name: E2E contra mock Jira/Xray
        run: ./scripts/e2e-mock.sh
